<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HUD Speed">

  <title>HUD Speed & Traffic Radar</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    
    html, body {
      background-color: #000000;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 100vw;
      height: 100dvh;
      height: -webkit-fill-available;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      padding-left: max(20px, env(safe-area-inset-left));
      padding-right: max(20px, env(safe-area-inset-right));
    }

    body.mirrored {
      transform: scaleX(-1);
    }
    
    /* TOP BAR */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 500px;
    }
    .speed-limit-badge {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background-color: #FFFFFF;
      border: 5px solid #D50000;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #000000;
      font-size: 24px;
      font-weight: 900;
      box-shadow: 0 0 10px rgba(255,255,255,0.2);
    }
    .controls {
      display: flex;
      gap: 6px;
    }
    .btn {
      background-color: #1C1C1E;
      border: 1px solid #3A3A3C;
      color: #8E8E93;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn.active {
      color: #00E5FF;
      border-color: #00E5FF;
    }

    /* CENTRO: VELOCITÀ */
    .speed-display {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }
    .current-speed {
      font-size: clamp(90px, 32vw, 155px);
      font-weight: 900;
      line-height: 0.9;
      color: #00E5FF;
      letter-spacing: -4px;
      font-variant-numeric: tabular-nums;
      text-align: center;
      transition: color 0.3s ease;
    }
    .speed-unit {
      color: #8E8E93;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 3px;
      margin-top: 10px;
    }
    .advised-box {
      margin-top: 16px;
      padding: 8px 20px;
      border-radius: 20px;
      background-color: #121212;
      border: 1px solid #242424;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #00E5FF;
      transition: all 0.3s ease;
    }

    /* BOTTOM BAR */
    .bottom-bar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 500px;
    }
    .status-card {
      background-color: #121212;
      border: 1px solid #242424;
      border-radius: 12px;
      padding: 10px 14px;
      text-align: center;
    }
    .status-msg {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #00E5FF;
      margin-bottom: 4px;
    }
    .telemetry-mini {
      display: flex;
      justify-content: space-around;
      font-size: 11px;
      color: #636366;
    }
    .telemetry-mini b {
      color: #FFFFFF;
    }
    .btn-main {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      border: none;
      cursor: pointer;
    }
    .btn-start {
      background-color: #00E5FF;
      color: #000000;
    }
    .btn-stop {
      background-color: #D50000;
      color: #FFFFFF;
    }

    @media (orientation: landscape) {
      body {
        padding-top: max(8px, env(safe-area-inset-top));
        padding-bottom: max(8px, env(safe-area-inset-bottom));
      }
      .current-speed {
        font-size: clamp(80px, 24vh, 120px);
      }
      .status-card {
        padding: 6px;
      }
      .btn-main {
        padding: 10px;
      }
    }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <div class="top-bar">
    <div class="speed-limit-badge" id="speedLimit">--</div>
    <div class="controls">
      <button class="btn" id="btnKey" onclick="configuraChiave()">API KEY</button>
      <button class="btn" id="btnAudio" onclick="toggleAudio()">AUDIO: ON</button>
      <button class="btn" id="btnMirror" onclick="toggleMirror()">HUD</button>
    </div>
  </div>

  <!-- CENTRO: VELOCITÀ & DELTA CONSIGLIATO -->
  <div class="speed-display">
    <div class="current-speed" id="gpsSpeed">0</div>
    <div class="speed-unit">KM/H REALI</div>
    <div class="advised-box" id="advisedBox">
      IN ATTESA DI PARTENZA
    </div>
  </div>

  <!-- BOTTOM BAR -->
  <div class="bottom-bar">
    <div class="status-card">
      <div class="status-msg" id="statusMsg">PRONTO ALLA PARTENZA</div>
      <div class="telemetry-mini">
        <span>Campioni: <b id="sampleCount">0</b></span>
        <span>Stops: <b id="stopCount">0</b></span>
        <span>Radar: <b id="radarStatus">OFF</b></span>
      </div>
    </div>
    
    <button class="btn-main btn-start" id="btnAction" onclick="toggleTrip()">
      AVVIA VIAGGIO REALE
    </button>
  </div>

  <script>
    let isTracking = false;
    let watchId = null;
    let wakeLock = null;
    let audioEnabled = true;

    // TomTom API Key
    let tomtomApiKey = localStorage.getItem("tomtom_api_key") || "";

    // Telemetria di marcia
    let tripData = [];
    let startTime = null;
    let sampleCount = 0;
    let stopCount = 0;
    let currentLimit = 50;
    let lastQueryPos = null;
    let lastTrafficCheckTime = 0;
    let lastHeading = null;
    let previousCoord = null;

    // Dati radar
    let radarDistanceM = 9999;
    let radarSpeedKmh = 0;

    // Controllo annunci vocali
    let lastVoiceNoticeTime = 0;
    let lastAnnouncedDelta = 0;

    // DOM
    const gpsSpeedEl = document.getElementById('gpsSpeed');
    const advisedBoxEl = document.getElementById('advisedBox');
    const speedLimitEl = document.getElementById('speedLimit');
    const statusMsgEl = document.getElementById('statusMsg');
    const sampleCountEl = document.getElementById('sampleCount');
    const stopCountEl = document.getElementById('stopCount');
    const radarStatusEl = document.getElementById('radarStatus');
    const btnAction = document.getElementById('btnAction');
    const btnKey = document.getElementById('btnKey');

    if (tomtomApiKey) btnKey.classList.add('active');

    // ==========================================
    // 1. GESTIONE WAKE LOCK BLINDATA (IOS SAFARI)
    // ==========================================
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.log("WakeLock non disponibile:", err);
      }
    }

    // Se l'utente cambia app o l'iPhone si blocca, riaggancia il WakeLock al rientro
    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState === 'visible' && isTracking) {
        await requestWakeLock();
      }
    });

    // Controllo periodico di sicurezza ogni 15 secondi
    setInterval(async () => {
      if (isTracking && (!wakeLock || wakeLock.released)) {
        await requestWakeLock();
      }
    }, 15000);

    function configuraChiave() {
      const inserita = prompt("Incolla qui la tua API Key di TomTom:", tomtomApiKey);
      if (inserita !== null) {
        tomtomApiKey = inserita.trim();
        localStorage.setItem("tomtom_api_key", tomtomApiKey);
        btnKey.classList.toggle('active', !!tomtomApiKey);
        alert(tomtomApiKey ? "API Key salvata con successo!" : "API Key rimossa.");
      }
    }

    async function toggleTrip() {
      if (!isTracking) {
        startTrip();
      } else {
        stopTripAndExport();
      }
    }

    async function startTrip() {
      tripData = [];
      sampleCount = 0;
      stopCount = 0;
      previousCoord = null;
      lastVoiceNoticeTime = Date.now();
      startTime = new Date();

      await requestWakeLock();
      speak("Navigatore avviato");

      if ("geolocation" in navigator) {
        watchId = navigator.geolocation.watchPosition(
          onGpsSuccess,
          onGpsError,
          { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
        );
      } else {
        alert("Geolocalizzazione non supportata.");
        return;
      }

      isTracking = true;
      btnAction.innerText = "TERMINA E SALVA CSV";
      btnAction.className = "btn-main btn-stop";
      statusMsgEl.innerText = "AGGANCIO SEGNALE GPS...";
    }

    function stopTripAndExport() {
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
      if (wakeLock !== null) {
        wakeLock.release().catch(() => {});
        wakeLock = null;
      }
      isTracking = false;

      btnAction.innerText = "AVVIA VIAGGIO REALE";
      btnAction.className = "btn-main btn-start";
      statusMsgEl.innerText = "VIAGGIO COMPLETATO. SALVATAGGIO...";
      advisedBoxEl.innerText = "VIAGGIO TERMINATO";
      advisedBoxEl.style.color = "#8E8E93";

      esportaCSV();
    }

    function onGpsSuccess(pos) {
      const coords = pos.coords;
      const speedKmh = coords.speed !== null && coords.speed > 0 ? Math.round(coords.speed * 3.6) : 0;
      const lat = coords.latitude;
      const lon = coords.longitude;
      const now = new Date();
      const elapsedSec = Math.round((now - startTime) / 1000);

      // Calcola direzione (heading) dal GPS o vettore di spostamento
      if (coords.heading !== null && !isNaN(coords.heading) && coords.heading >= 0) {
        lastHeading = coords.heading;
      } else if (previousCoord && speedKmh > 10) {
        lastHeading = calcolaBearing(previousCoord.lat, previousCoord.lon, lat, lon);
      }
      previousCoord = { lat, lon };

      gpsSpeedEl.innerText = speedKmh;
      if (speedKmh === 0) stopCount++;
      sampleCount++;
      sampleCountEl.innerText = sampleCount;
      stopCountEl.innerText = stopCount;

      // 1. Aggiorna limiti stradali da OpenStreetMap ogni 250 metri
      aggiornaLimiteStradale(lat, lon);

      // 2. Radar TomTom ogni 20 secondi se in marcia (> 25 km/h)
      const nowTime = Date.now();
      if (tomtomApiKey && (nowTime - lastTrafficCheckTime > 20000) && speedKmh > 25 && lastHeading !== null) {
        lastTrafficCheckTime = nowTime;
        interrogaRadarTraffico(lat, lon, lastHeading, speedKmh);
      }

      // 3. Algoritmo Traffic Smoothing
      let targetSpeed = currentLimit;
      let stato = "SCORREVOLE";

      if (radarDistanceM <= 2500 && radarSpeedKmh < (currentLimit * 0.50)) {
        const fattore = Math.max(0.1, radarDistanceM / 2500.0);
        const vCalc = radarSpeedKmh + (currentLimit - radarSpeedKmh) * Math.pow(fattore, 0.8);
        targetSpeed = Math.max(25, Math.min(Math.round(vCalc), currentLimit));
        stato = "DECELERAZIONE";
        statusMsgEl.innerText = `RALLENTAMENTO A ${radarDistanceM}M (${radarSpeedKmh} KM/H)`;
        statusMsgEl.style.color = "#FFB300";
      } else if (speedKmh > currentLimit) {
        stato = "ECCESSO";
        statusMsgEl.innerText = "SUPERAMENTO LIMITE LEGALE";
        statusMsgEl.style.color = "#FF3D00";
      } else {
        statusMsgEl.innerText = "FLUSSO REGOLARE";
        statusMsgEl.style.color = "#00E5FF";
      }

      // 4. Aggiorna HUD e Istruzioni Vocali Delta
      aggiornaIndicazioniDelta(speedKmh, targetSpeed);

      // 5. Scrittura Campione
      tripData.push({
        iso: now.toISOString(),
        secondi: elapsedSec,
        lat: lat.toFixed(6),
        lon: lon.toFixed(6),
        speed: speedKmh,
        limite: currentLimit,
        target: targetSpeed,
        coda_dist_m: radarDistanceM < 9000 ? radarDistanceM : "Nessuna",
        coda_vel_kmh: radarDistanceM < 9000 ? radarSpeedKmh : "N/A",
        stato: stato
      });
    }

    function onGpsError(err) {
      statusMsgEl.innerText = "ERRORE GPS: " + err.message;
      statusMsgEl.style.color = "#FF3D00";
    }

    // ==========================================
    // 2. GESTIONE ISTRUZIONI VOCALI E HUD A DELTA
    // ==========================================
    function aggiornaIndicazioniDelta(vReale, vTarget) {
      const diff = vReale - vTarget; // Positivo = troppo veloce, Negativo = lento
      const now = Date.now();

      if (diff >= 5) {
        const delta = Math.round(diff);
        advisedBoxEl.innerHTML = `RALLENTA DI <span style="color:#FF3D00;">${delta}</span> KM/H`;
        advisedBoxEl.style.borderColor = "#FF3D00";
        gpsSpeedEl.style.color = "#FF3D00";

        // Feedback vocale (cooldown di 9 secondi)
        if (audioEnabled && (now - lastVoiceNoticeTime > 9000)) {
          if (Math.abs(delta - lastAnnouncedDelta) >= 3 || (now - lastVoiceNoticeTime > 16000)) {
            speak(`Rallenta di ${delta} all'ora`);
            lastAnnouncedDelta = delta;
            lastVoiceNoticeTime = now;
          }
        }
      } else if (diff <= -8 && vReale > 18) {
        // Accelera solo se già in marcia (> 18 km/h), mai da fermi al semaforo
        const delta = Math.round(Math.abs(diff));
        advisedBoxEl.innerHTML = `ACCELERA DI <span style="color:#00E5FF;">${delta}</span> KM/H`;
        advisedBoxEl.style.borderColor = "#00E5FF";
        gpsSpeedEl.style.color = "#00E5FF";

        if (audioEnabled && (now - lastVoiceNoticeTime > 9000)) {
          if (Math.abs(delta - lastAnnouncedDelta) >= 3 || (now - lastVoiceNoticeTime > 16000)) {
            speak(`Accelera di ${delta} all'ora`);
            lastAnnouncedDelta = delta;
            lastVoiceNoticeTime = now;
          }
        }
      } else {
        // Velocità ottimale
        advisedBoxEl.innerHTML = `VELOCITÀ OTTIMALE (<span style="color:#00E676;">${vTarget}</span>)`;
        advisedBoxEl.style.borderColor = "#00E676";
        gpsSpeedEl.style.color = "#00E676";
        lastAnnouncedDelta = 0;
      }
    }

    // ==========================================
    // 3. RADAR TRAFFICO CON SONDA ADATTIVA
    // ==========================================
    async function interrogaRadarTraffico(lat, lon, headingDeg, speedKmh) {
      // Sonda breve (600m) in città/extraurbano, 1500m in autostrada
      const distanzaSondaMetri = speedKmh > 75 ? 1500 : 600;
      const sonda = proiettaCoordinate(lat, lon, distanzaSondaMetri, headingDeg);
      
      const url = `https://api.tomtom.com/traffic/services/4/flowSegmentData/absolute/10/json?point=${sonda.lat},${sonda.lon}&key=${tomtomApiKey}`;

      try {
        radarStatusEl.innerText = "SCANSIONE...";
        const res = await fetch(url);
        const data = await res.json();

        if (data && data.flowSegmentData) {
          const vAttuale = data.flowSegmentData.currentSpeed;
          const vLibera = data.flowSegmentData.freeFlowSpeed;

          if (vAttuale < (vLibera * 0.55)) {
            radarDistanceM = distanzaSondaMetri;
            radarSpeedKmh = vAttuale;
            radarStatusEl.innerText = `CODA (${vAttuale}km/h)`;
          } else {
            radarDistanceM = 9999;
            radarStatusEl.innerText = "LIBERO";
          }
        }
      } catch (err) {
        radarStatusEl.innerText = "OFFLINE";
      }
    }

    function proiettaCoordinate(lat, lon, distanzaM, bearingDeg) {
      const R = 6371000;
      const d = distanzaM / R;
      const brng = bearingDeg * Math.PI / 180;
      const lat1 = lat * Math.PI / 180;
      const lon1 = lon * Math.PI / 180;

      const lat2 = Math.asin(Math.sin(lat1) * Math.cos(d) + Math.cos(lat1) * Math.sin(d) * Math.cos(brng));
      const lon2 = lon1 + Math.atan2(Math.sin(brng) * Math.sin(d) * Math.cos(lat1), Math.cos(d) - Math.sin(lat1) * Math.sin(lat2));

      return {
        lat: (lat2 * 180 / Math.PI).toFixed(6),
        lon: (lon2 * 180 / Math.PI).toFixed(6)
      };
    }

    function calcolaBearing(lat1, lon1, lat2, lon2) {
      const y = Math.sin((lon2 - lon1) * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180);
      const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
                Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos((lon2 - lon1) * Math.PI / 180);
      return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }

    // ==========================================
    // 4. LIMITI STRADALI OPENSTREETMAP (CORRETTO)
    // ==========================================
    async function aggiornaLimiteStradale(lat, lon) {
      if (lastQueryPos) {
        const d = distanzaMetri(lastQueryPos.lat, lastQueryPos.lon, lat, lon);
        if (d < 250) return;
      }
      lastQueryPos = { lat, lon };

      // Corretto: aggiunto il simbolo $ davanti a {lon}
      const query = `[out:json][timeout:3];way(around:35,${lat},${lon})[highway];out tags;`;
      try {
        const res = await fetch("https://overpass-api.de/api/interpreter", {
          method: "POST",
          body: "data=" + encodeURIComponent(query)
        });
        const data = await res.json();
        const fallback = {
          "motorway": 130, "trunk": 110, "primary": 90,
          "secondary": 90, "residential": 50, "living_street": 30
        };

        for (const el of data.elements || []) {
          const tags = el.tags || {};
          if (tags.maxspeed && !isNaN(parseInt(tags.maxspeed))) {
            impostaLimite(parseInt(tags.maxspeed));
            return;
          }
          if (tags.highway && fallback[tags.highway]) {
            impostaLimite(fallback[tags.highway]);
            return;
          }
        }
      } catch (e) {}
    }

    function impostaLimite(nuovoLimite) {
      if (nuovoLimite !== currentLimit) {
        currentLimit = nuovoLimite;
        speedLimitEl.innerText = currentLimit;
      }
    }

    function distanzaMetri(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function speak(text) {
      if (!audioEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const ut = new SpeechSynthesisUtterance(text);
      ut.lang = 'it-IT';
      ut.rate = 1.05;
      window.speechSynthesis.speak(ut);
    }

    function toggleMirror() {
      document.body.classList.toggle('mirrored');
      document.getElementById('btnMirror').classList.toggle('active');
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      const btn = document.getElementById('btnAudio');
      btn.innerText = audioEnabled ? "AUDIO: ON" : "AUDIO: OFF";
      btn.classList.toggle('active', audioEnabled);
    }

    function esportaCSV() {
      if (tripData.length === 0) {
        alert("Nessun dato registrato.");
        return;
      }

      let csvContent = "timestamp_iso,secondi_trascorsi,latitudine,longitudine,velocita_gps_kmh,limite_vigente_kmh,velocita_consigliata_kmh,distanza_coda_m,velocita_coda_kmh,stato\n";
      tripData.forEach(row => {
        csvContent += `${row.iso},${row.secondi},${row.lat},${row.lon},${row.speed},${row.limite},${row.target},${row.coda_dist_m},${row.coda_vel_kmh},${row.stato}\n`;
      });

      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      const d = new Date();
      const filename = `viaggio_radar_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}_${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}.csv`;

      link.setAttribute("href", url);
      link.setAttribute("download", filename);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
